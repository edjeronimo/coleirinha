{% extends 'site/base_sem_carrossel.html' %}

{% block content %}

<div class="card card-info">
    <div class="card-header">
        <h3 class="card-title">Enviar pedido para adotar <b>{{animal['nome']}}</b></h3>
    </div>
    
    <!-- Formulário horizontal -->
    <form class="form-horizontal" method="POST" enctype="multipart/form-data">
        <div class="card-body">
            <div class="form-group row">
                <label for="nome" class="col-sm-2 col-form-label">Nome</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="nome" id="nome" placeholder="Digite seu nome completo" required>
                </div>
            </div>

            <!-- Campo Telefone -->
            <div class="form-group row">
                <label for="telefone" class="col-sm-2 col-form-label">Telefone</label>
                <div class="col-sm-10">
                    <input type="tel" class="form-control" name="telefone" id="telefone" placeholder="Digite somente números" required>
                </div>
            </div>

            <div class="form-group row">
                <label for="email" class="col-sm-2 col-form-label">E-mail</label>
                <div class="col-sm-10">
                    <input type="email" class="form-control" name="email" id="email" placeholder="Digite seu E-mail" required>
                </div>
            </div>

            <div class="form-group row">
                <label for="endereco" class="col-sm-2 col-form-label">Cidade</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="endereco" id="endereco" placeholder="Digite sua cidade e estado" required>
                </div>
            </div>

            <input type="hidden" name="id_animal" value="{{animal['id']}}">
        </div> 

        <div class="card-footer">
            <button type="submit" class="btn btn-info">Enviar pedido</button>
            <a href="{{url_for('index')}}"><button type="button" class="btn btn-danger float-right">Cancelar</button></a>
        </div> <!-- Fim do card-footer -->
    </form>
</div> <!-- Fim do card -->

{% endblock %}
