<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleirinha - Adoção responsável</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="shortcut icon" href="../../static/img/coleira.png">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Barra superior -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid" style="padding: 15px;">
            <a class="navbar-brand" href="{{url_for('index')}}">
                <img src="../../static/img/coleira.png" alt="Logo" width="25" height="25" class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{url_for('index')}}">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('animais')}}">Animais disponíveis</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('animais_adotados')}}">Animais adotados</a>
                    </li>
                    <li class="nav-item">
                      <a class="nav-link" href="#">Contatos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('admin')}}">ADMIN</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <!-- Conteúdo principal -->
    <div class="container bg-body-light">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Rodapé -->
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
        <div class="col-md-4 d-flex align-items-center">
            <a href="{{url_for('index')}}" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
                <img src="../../static/img/coleira.png" alt="Logo" width="25" height="25">
            </a>
            <span class="mb-3 mb-md-0 text-body-secondary">© 2024, Coleirinha</span>
        </div>

        <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
            <li class="ms-3"><a class="text-body-secondary" href="#"><img src="../../static/img/facebook.png" alt="Facebook" width="24" height="24"></a></li>
            <li class="ms-3"><a class="text-body-secondary" href="#"><img src="../../static/img/instagram.png" alt="Instagram" width="24" height="24"></a></li>
            <li class="ms-3"><a class="text-body-secondary" href="#"><img src="../../static/img/twitter.png" alt="Twitter" width="24" height="24"></a></li>
        </ul>
    </footer>
</body>
</html>
