<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Coleirinha - Adote um amigo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site de adoção de animais">
    <meta name="keywords" content="animais">
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css">
    
    <!-- Third Party Plugins -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.3.0/styles/overlayscrollbars.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/apexcharts@3.37.1/dist/apexcharts.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css">
    <link href="https://cdn.datatables.net/v/dt/dt-2.1.6/datatables.min.css" rel="stylesheet">
    
    <!-- Required Plugin (AdminLTE) -->
    <link rel="stylesheet" href="../../static/admin/css/adminlte.css">
    <link rel="shortcut icon" href="../../static/img/coleira.png">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <!-- Header -->
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item"> <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"> <i class="bi bi-list"></i> </a> </li>
                    <li class="nav-item d-none d-md-block"> <a href="{{url_for('admin')}}" class="nav-link">Home admin</a> </li>
                    <li class="nav-item d-none d-md-block"> <a href="{{url_for('index')}}" class="nav-link">Voltar ao site</a> </li>
                </ul>
            </div>
        </nav>

<!-- Sidebar -->     
<aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
    <div class="sidebar-brand"> 
        <a href="{{url_for('admin')}}" class="brand-link">
            <img src="../../static/img/coleira.png" alt="Coleirinha Logo" class="brand-image">
            <span class="brand-text fw-light">Coleirinha</span>
        </a>
    </div>
    <div class="sidebar-wrapper">
        <nav class="mt-2">
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview">
                <li class="nav-item menu-open"> 
                    <a href="#" class="nav-link active"> 
                        <i class="bi bi-box-arrow-in-right"></i>
                        <p>Cadastros <i class="nav-arrow bi bi-chevron-right"></i></p>
                    </a>
                    <ul class="nav nav-treeview">
                        <li class="nav-item"> 
                            <a href="{{url_for('listarEspecies')}}" class="nav-link"> 
                                <i class="bi bi-arrow-return-right"></i> 
                                <p>Especies</p> 
                            </a> 
                        </li>
                        <li class="nav-item"> 
                            <a href="{{url_for('listarAnimais')}}" class="nav-link"> 
                                <i class="bi bi-arrow-return-right"></i> 
                                <p>Animais</p> 
                            </a> 
                        </li>
                        <li class="nav-item"> 
                            <a href="#" class="nav-link"> 
                                <i class="bi bi-arrow-return-right"></i> 
                                <p>Usuários</p> 
                            </a> 
                        </li>
                        <li class="nav-item"> 
                            <a href="{{url_for('pedidoAdocao')}}" class="nav-link"> 
                                <i class="bi bi-arrow-return-right"></i> 
                                <p>Adoção</p> 
                            </a> 
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>
    </div>
</aside>

        
        <!-- Content Block -->
        {% block content %}{% endblock %}

        <!-- Footer -->
        <footer class="app-footer"> 
            <div class="float-end d-none d-sm-inline">Edmilson Jerônimo</div>
            <strong>Copyright © 2024</strong> Todos os direitos reservados.
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.3.0/browser/overlayscrollbars.browser.es6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="../../static/admin/js/adminlte.js"></script>

    <!-- OverlayScrollbars Configure -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const sidebarWrapper = document.querySelector(".sidebar-wrapper");
            if (sidebarWrapper && typeof OverlayScrollbarsGlobal?.OverlayScrollbars !== "undefined") {
                OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
                    scrollbars: {
                        theme: "os-theme-light",
                        autoHide: "leave",
                        clickScroll: true,
                    },
                });
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.37.1/dist/apexcharts.min.js"></script>
    <script src="https://cdn.datatables.net/v/dt/dt-2.1.6/datatables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"></script>

    <!-- Custom Script -->
    <script>
        // Configurações e inicializações de gráficos e mapas podem ser feitas aqui.
    </script>
</body>
</html>
