{% extends 'admin/base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="card card-primary">
            <div class="card-header">
                <h3 class="card-title">Editar espécie</h3>
            </div>
            <form method="POST" enctype="multipart/form-data">
                <div class="card-body">
                    <!-- Nome -->
                    <div class="form-group">
                        <label for="nome">Nome:</label>
                        <input type="text" class="form-control" name="nome" id="nome" placeholder="Alterar para" value="{{especie['nome']}}">
                    </div>
                    <p></p>

                    <!-- Descrição -->
                    <div class="form-group">
                        <label for="descricao">Descrição:</label>
                        <input type="text" class="form-control" name="descricao" id="descricao" placeholder="Alterar para" value="{{especie['descricao']}}">
                    </div>
                    <p></p>

                    <!-- Imagem -->
                    <div class="mb-3">
                        <label for="img" class="form-label">Selecione a nova imagem</label>
                        <input class="form-control" type="file" name="img" id="img">
                    </div>
                    <div class="card" style="width: 8rem;">
                        <img src="data:image/jpeg;base64,{{especie['img']}}" class="card-img-top" alt="imagem da espécie">
                        <p class="card-body">Imagem atual</p>
                    </div>
                    <p></p>

                    <!-- Ativo -->
                    <div class="form-group">
                        <label for="ativo">Ativo:</label>
                        <select class="form-control" name="ativo" id="ativo">
                            <option value="1" {% if especie['ativo'] == 1 %}selected{% endif %}>SIM</option>
                            <option value="0" {% if especie['ativo'] == 0 %}selected{% endif %}>NÃO</option>
                        </select>
                    </div>
                </div>

                <!-- Botões de ação -->
                <div class="card-footer">
                    <button type="submit" class="btn btn-success">Finalizar</button>
                    <a href="{{url_for("listarEspecies")}}">
                        <button type="button" class="btn btn-primary">Cancelar</button>
                    </a>
                </div>
            </form>
        </div> <!-- card card-primary -->
    </div> <!-- row -->
</div> <!-- container-fluid -->
{% endblock %}
